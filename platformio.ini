; PlatformIO Project Configuration File
;
; Environments:
;   wemos_d1_mini32  - the supported ESP32 board (firmware)
;   native           - host build of the pure modules for unit tests
;                      (run with: pio test -e native)

[platformio]
default_envs = wemos_d1_mini32

[env:wemos_d1_mini32]
; NimBLE 1.4.x uses the Arduino-ESP32 2.x / ESP-IDF 4.4 BLE integration.
; Upgrading to Arduino 3.x also requires migrating BleManager to NimBLE 2.x.
platform = espressif32@7.0.1
board = wemos_d1_mini32
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
	pre:scripts/version.py
	pre:scripts/webui.py
; Match the native build: Arduino 2.x otherwise defaults to C++11.
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-I src
	-DCORE_DEBUG_LEVEL=0
	; Keep BLE failure reasons visible without enabling all Arduino debug logs.
	-DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
	-DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT=1
	-Wall
	-Wextra
	-Wno-unused-parameter
lib_deps =
	h2zero/NimBLE-Arduino@1.4.3
	knolleary/PubSubClient@^2.8
	jandrassy/TelnetStream@^1.3.0
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.4.0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
	bblanchon/ArduinoJson@^7.4.0
build_flags =
	-std=c++17
	-I src
	-I test/support
	-DEDK_NATIVE
	-Wall
	-Wextra
build_src_filter =
	+<core/>
	+<protocol/ModbusFrame.cpp>
	+<protocol/Decoders.cpp>
	+<commands/>
	+<stove/StoveState.cpp>
	+<stove/StoveController.cpp>
	+<ble/BleSessionPolicy.cpp>
	+<mqtt/Topics.cpp>
	+<logging/Logger.cpp>
	+<config/AppConfig.cpp>
	+<config/ConfigJson.cpp>
	+<diagnostics/Diagnostics.cpp>
	+<web/DigestAuth.cpp>
	+<ota/OtaImage.cpp>
